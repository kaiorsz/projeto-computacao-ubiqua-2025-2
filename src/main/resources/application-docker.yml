# ============================================
# Configuration for Docker environment
# ============================================
# This file is activated when SPRING_PROFILES_ACTIVE=docker

spring:
  application:
    name: hemograma-ubiquo
  
  # H2 Database configuration (file-based for persistence)
  datasource:
    url: jdbc:h2:file:/app/data/hemograma_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA/Hibernate configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  # H2 Console (enabled for debug)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  # Jackson JSON configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Server configuration
server:
  port: 8081
  servlet:
    context-path: /hemograma-api

# Swagger/OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# Logging configuration (less verbose for Docker)
logging:
  level:
    br.ufg.inf.hemograma: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Application specific settings
app:
  hemograma:
    # Reference values for analysis
    valores-referencia:
      leucocitos:
        minimo: 4000.0
        maximo: 11000.0
        unidade: "/uL"
      hemoglobina:
        minimo: 12.0
        maximo: 17.5
        unidade: "g/dL"
      plaquetas:
        minimo: 150000.0
        maximo: 450000.0
        unidade: "/uL"
      hematocrito:
        minimo: 36.0
        maximo: 52.0
        unidade: "%"
    
    # Collective analysis settings
    analise-coletiva:
      janela-deslizante-horas: 24
      limite-alertas-criticos: 5
      percentual-desvio-critico: 50.0
    
    # FHIR settings - Using Docker service name
    fhir:
      server-url: "http://fhir:8080/fhir"
      subscription-endpoint: "/Subscription"
      observation-endpoint: "/Observation"
      timeout-seconds: 30

# Actuator/Management configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

